services:
  nginx:
    image: nginx:1.26-alpine3.19-slim
    ports:
      - 8080:80
      - 443:443
    volumes:
      - type: bind
        source: ./nginx/default-ssl.conf
        target: /etc/nginx/conf.d/default.conf
      - type: bind
        source: ./nginx/certs
        target: /etc/nginx/certs
      - type: bind
        source: ./nginx/static
        target: /var/www/html
    depends_on:
     - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate --spider nginx:80/nginx-health-check || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
      tags:
        - crpdl/phpiaca
    volumes:
      - type: bind
        source: ./backend
        target: /var/www/html
      - type: volume
        source: db-data
        target: /logs
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/status;SCRIPT_FILENAME=/status;REQUEST_METHOD=GET;", "cgi-fcgi", "-bind", "-connect", "backend:9000"]
      interval: 60s
      timeout: 10s
      retries: 3
#SCRIPT_NAME=/status;SCRIPT_FILENAME=/status;REQUEST_METHOD=GET;cgi-fcgi -bind -connect localhost:9000

    restart: unless-stopped

volumes:
  db-data:

