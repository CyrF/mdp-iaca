<!-- Modal -->
<div class="modal show" id="NewAccountModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header" style="display:initial;">
				<h5 class="modal-title">Création d'un nouveau compte</h5>
			</div>
			<form action="create_user.php?pg=exam&role={Account_Type}" method="POST">
				<div class="modal-body">

					<div class="mb-3">
						<label class="form-label">
							Nom complet
						</label>
						<div class="input-group">
							<input type="text" class="form-control bg-body" id="user_prenom" name="user_prenom" required
								placeholder="Prénom" />

							<input type="text" class="form-control bg-body" id="user_nom" name="user_nom" required
								placeholder="Nom" />
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label">Durée de validité</label>
						<select class="form-select" name="expiration">
							<option value="1">24 Heures</option>
							<option value="7">7 jours</option>
							<option value="15">15 jours</option>
						</select>
					</div>
    <!-- Hidden field containing the secret token -->
    <input type="hidden" name="csrf_token" value="{csrf_token}">
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
					<button type="submit" class="btn btn-primary" id="saveBtn">Enregistrer</button>
				</div>
			</form>
		</div>
	</div>
</div>

<script>
	//todo: drop ajax, just submit form to php.

	document.addEventListener('DOMContentLoaded', function () {
		// crée une instance du modal, requis avec BS5
		const NewAccountModal = document.getElementById('NewAccountModal');
		bootstrap.Modal.getOrCreateInstance(NewAccountModal);

		// desactive le bouton save, pour éviter doublons.
		document.querySelector('form').addEventListener('submit', function (e) {
			const btn = document.getElementById('saveBtn');
			btn.disabled = true;
			btn.innerHTML = 'Création...';
		});
	});
</script>
