<!-- INCLUDE head_entete -->

<body>

	<!-- INCLUDE nav_barre_horizontale -->

	<!-- INCLUDE form_nouveaucompte -->

	<!-- IF_DEFINED msg_create_ok -->
	<div class="alert alert-success alert-dismissible fade show" role="alert">
		Nouvel utilisateur créé !
		<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
	</div>
	<!-- ENDIF -->
	<!-- IF_DEFINED msg_create_err -->
	<div class="alert alert-danger alert-dismissible fade show" role="alert">
		Une erreur est survenue, le compte n'a pas été créé :
		{msg_create_err}
		<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
	</div>
	<!-- ENDIF -->

	<div id="contenu">
		<div class="container navbar">
			<div class="container-fluid d-print-none">
				<h3>Comptes temporaires de type {Account_Type}</h3>

				<span>
					<!-- IF_DEFINED AfficherMenuCompteExams -->
					<button class='btn btn-outline-success btn-sm' type='button' data-bs-toggle='modal'
						data-bs-target='#NewAccountModal' data-bs-title='This title is nice.'>
						<i class="fa-solid fa-user-plus"></i> Ajouter un compte
					</button>
					<!-- ENDIF -->
				</span>
			</div>

			<table class="table table-striped table-hover">
				<thead class="table-dark">
					<tr>
						<th>Identifiant</th>
						<th>Mot de passe</th>
						<th style="text-align:center;">Assigné à</th>
						<th class="d-print-none">Créé par</th>
						<th class="d-print-none">Expiration</th>
						<th class="d-print-none">&nbsp;</th>
					</tr>
				</thead>

				<!-- BEGIN exams -->
				<tbody id="tableAccounts">
					<tr>
						<td>{exams.IDENTIFIANT}</td>
						<td>{b64_exams.PASSWORD}</td>
						<td>{exams.NOMCOMPLET}</td>
						<td class="d-print-none">{exams.CREATEDBY}</td>
						<td class="d-print-none">{exams.WHENCREATED}</td>
						<td class="d-print-none">
							<button type='button' class='btn btn-outline-secondary btn-sm d-print-none me-3'>
								<i class="fa fa-solid fa-trash"></i> Supprimer
							</button>
						</td>
					</tr>
					<!-- STOP exams -->
					<tr id="addedAccounts"></tr>
				</tbody>
			</table>
			<img src="./runcat2.gif" style="visibility:hidden;" />
		</div>
	</div>

	<script
		src="{navigation.BASE_URL}/vendor/bootstrap/{navigation.BOOTSTRAP_VERSION}/bootstrap.bundle.min.js"></script>
